apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-build-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blanketops/infrastructure-gitops.git
    targetRevision: main
    path: platforms/secure-build-engine
  destination:
    # The Argo CD cluster secret of the build (write) cluster.
    name: build-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
