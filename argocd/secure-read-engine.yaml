apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-read-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blanketops/infrastructure-gitops.git
    targetRevision: main
    path: platforms/secure-read-engine
  destination:
    # Argo CD runs in the read (workload) cluster, so this is its own cluster.
    server: https://kubernetes.default.svc
    namespace: cosign-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # The policy-controller CRDs are large; client-side apply can exceed the
    # last-applied annotation limit.
    - ServerSideApply=true
    # policy-controller validates ClusterImagePolicies with its own webhook,
    # which refuses them until it is running; retry until it is.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
